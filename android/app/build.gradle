// ---------------------------------------------------------------------------
// AURA for Android
//
// This module is a thin Java shell - a WebView, the system file picker, and the
// "all files" permission - wrapped around the same Python program the desktop
// build ships:
//
//   * Chaquopy puts CPython inside the APK and runs AURA from src/main/python,
//     which is a byte-identical copy of the desktop tree (tools/sync_aura.py
//     keeps it that way, and a test refuses to let the two drift apart);
//   * AURA's own HTTP server then serves the same interface on 127.0.0.1, and
//     the WebView shows it - one interface, one library format, one answer
//     pipeline, on both platforms;
//   * the llama.cpp engine cannot be downloaded at run time, because Android 10
//     and later refuse to execute a file an app wrote into its own storage, so
//     it is unpacked into the APK's native library directory *here*, at build
//     time (see prepareAuraEngine below).
//
// Nothing in the engine step is required to run AURA. If the build machine is
// offline, or GitHub is unreachable, the APK is still produced: AURA indexes,
// searches and answers with quoted passages, and it says on screen that this
// copy was built without the local model engine.
// ---------------------------------------------------------------------------

import groovy.transform.Field

plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The log the *methods* below write to.
//
// A method cannot see a script-level `def` (see the note on engineBinary), so
// anything a method needs has to be an `@Field` - the second of the two scoping
// rules this file has already been bitten by. `logger` resolves fine inside
// closures, but the engine code that reports sizes and failures is in methods,
// so there is exactly one logger and it lives here.
@Field def auraLog = logger

// ---------------------------------------------------------------------------
// The model engine
// ---------------------------------------------------------------------------
// The desktop build asks GitHub for the newest llama.cpp release; a phone
// cannot, so this is pinned to one release whose contents are known to be laid
// out the way the task below expects. Every file listed in `engineLibs` is also
// listed in aura/catalog.py, and a test fails if the two lists ever disagree.
def engineTag = "b11136"
def engineArchiveName = "llama-${engineTag}-bin-android-arm64.tar.gz"
def engineUrl = "https://github.com/ggml-org/llama.cpp/releases/download/${engineTag}/${engineArchiveName}"

// The same archive, kept on a second host. GitHub's release download is the
// canonical source, but a build machine that cannot reach it - an egress rule,
// a rate limit, an outage - would produce an APK with no engine in it, and that
// failure is invisible until somebody tries to load a model on the phone. So
// there are two sources and each one has to produce a byte-exact copy: the
// pinned size and sha256 below are checked after every attempt.
//
// Re-fetching the canonical copy is one command:
//   curl -L -o llama-b11136-bin-android-arm64.tar.gz \
//     https://github.com/ggml-org/llama.cpp/releases/download/b11136/llama-b11136-bin-android-arm64.tar.gz
def engineArchiveBytes = 72537038L
def engineArchiveSha256 = "6217fb610015b2e5cc702a52c715a59d23776172c9da8056a1a43f3f524debaa"
def engineMirrors = [
        engineUrl,
        "https://user.uploads.dev/file/59e4a2b907fa4a05ddb9397c8a399c0a.gz",
]

// A build without the engine is a different app: half the size, and it reads,
// searches and quotes your documents, but it cannot run a model. That is a
// reasonable thing to want - it is what a build machine that cannot reach the
// internet can still produce - but it must never happen *by accident*, because
// the result looks fine until the moment a model is needed. So it is opt-in:
// pass -PauraEngineOptional=true (or set AURA_ENGINE_OPTIONAL=1) to allow it,
// and otherwise a build that cannot bundle the engine fails, in this log, with
// the reason.
def engineOptionalValue = (project.findProperty("auraEngineOptional")
        ?: System.getenv("AURA_ENGINE_OPTIONAL") ?: "false") as String
def engineOptional = ["1", "true", "yes", "on"].contains(engineOptionalValue.trim().toLowerCase())
def engineRequired = !engineOptional

// llama.cpp's Android build is a seven-kilobyte launcher plus the real code in
// shared objects. The launcher is the executable; Android only puts files named
// lib*.so into the native library directory (the one place an app may execute
// from), so it is renamed on the way in.
//
// Two opposite scoping rules live in these two lines, and each has already cost
// a build:
//
//   * a plain `def` at script level is visible to *closures* but invisible to
//     *methods*;
//   * an `@Field` is visible to methods but invisible to closures.
//
// So `engineBinary` stays a `def` - the prepareAuraEngine closure below reads
// it - and is handed to stripEngine() as a parameter, while `supportedPython`
// (further down) is an `@Field` because only a method reads that one. Getting
// either backwards is not a compile error: it is "Could not get unknown
// property ..." at the moment the code runs.
def engineBinary = "libllama-server-bin.so"
def engineLibs = [
        "libllama-server-impl.so",
        "libllama-common.so",
        "libllama.so",
        "libmtmd.so",
        "libggml.so",
        "libggml-base.so",
        "libggml-cpu-android_armv8.0_1.so",
        "libggml-cpu-android_armv8.2_1.so",
        "libggml-cpu-android_armv8.2_2.so",
        "libggml-cpu-android_armv8.6_1.so",
        "libggml-cpu-android_armv9.0_1.so",
        "libggml-cpu-android_armv9.2_1.so",
        "libggml-cpu-android_armv9.2_2.so",
]

def engineRawDir = layout.buildDirectory.dir("engine/raw")
def engineJniDir = layout.buildDirectory.dir("engine/jniLibs")
def engineStamp = layout.buildDirectory.file("engine/engine.ok")

// ---------------------------------------------------------------------------
// Which Python
// ---------------------------------------------------------------------------
// The Chaquopy steps that need a Python on the build machine - installing the
// packages below, compiling bytecode - insist that it has the same major.minor
// version as the app. Rather than hard-code a version that only matches the
// machine it was written on, ask the machine, and let an explicit
// `-PbuildPython=/usr/bin/python3.12` override the probe.
//
// The range is what Chaquopy 16.1 builds for, less 3.8: Chaquopy still accepts
// 3.8, but there are no Android wheels for lxml or Pillow at 3.8, so a 3.8
// build machine would have to compile them. See the note on engineBinary above
// for why this is an `@Field` and not a `def`.
@Field List<String> supportedPython = ["3.9", "3.10", "3.11", "3.12", "3.13"]

/** The absolute path of a command, looked up on PATH, or null. */
String onPath(String name) {
    if (!name) {
        return null
    }
    def direct = new File(name)
    if (direct.isAbsolute()) {
        return (direct.isFile() && direct.canExecute()) ? direct.absolutePath : null
    }
    def path = System.getenv("PATH") ?: ""
    for (String entry : path.split(File.pathSeparator)) {
        def candidate = new File(entry, name)
        if (candidate.isFile() && candidate.canExecute()) {
            return candidate.absolutePath
        }
    }
    return null
}

/** The version a Python reports for itself, as "major.minor", or null. */
String pythonVersionOf(String exe) {
    try {
        def process = new ProcessBuilder(exe, "-c", "import sys; print('%d.%d' % sys.version_info[:2])")
                .redirectErrorStream(true).start()
        def text = process.inputStream.text.trim()
        process.waitFor()
        return (text ==~ /\d+\.\d+/) ? text : null
    } catch (Exception ignored) {
        return null
    }
}

// The names to try, best first: a machine can have several Pythons installed,
// and the one called `python3` is not always one Chaquopy can build for.
List<String> pythonCandidates() {
    return ["python3", "python3.13", "python3.12", "python3.11", "python3.10", "python3.9", "python"]
}

def detectBuildPython() {
    def override = project.findProperty("buildPython")
    if (override) {
        def exe = onPath(override.toString()) ?: override.toString()
        def version = pythonVersionOf(exe)
        if (version) {
            if (!supportedPython.contains(version)) {
                logger.warn("AURA: -PbuildPython is Python ${version}, which Chaquopy 16.1 does not " +
                        "build for (it knows ${supportedPython.join(', ')}) - using it anyway, because " +
                        "you asked for it")
            }
            return [exe, version]
        }
        logger.warn("AURA: -PbuildPython=${override} is not a Python that runs; ignoring it")
    }
    for (String name : pythonCandidates()) {
        def exe = onPath(name)
        if (exe == null) {
            continue
        }
        def version = pythonVersionOf(exe)
        if (version == null) {
            continue
        }
        if (!supportedPython.contains(version)) {
            logger.lifecycle("AURA: ${exe} is Python ${version}, which Chaquopy 16.1 does not build " +
                    "for - looking for another")
            continue
        }
        return [exe, version]
    }
    return [null, null]
}

def detectedPython = detectBuildPython()
def buildPythonExe = detectedPython[0]
def pythonVersion = detectedPython[1] ?: "3.11"
if (buildPythonExe == null) {
    logger.warn("AURA: no Python ${supportedPython.join('/')} was found on this machine, so Chaquopy " +
            "will go looking for Python ${pythonVersion} itself. If the build complains about the " +
            "Python version, pass -PbuildPython=/path/to/python3.11")
} else {
    logger.lifecycle("AURA: building against ${buildPythonExe} (Python ${pythonVersion})")
}

// The three packages are an upgrade, not a requirement: AURA reads PDFs and
// DOCX files with its own readers when they are absent. If a build machine
// cannot reach the package index, set AURA_NO_PYTHON_PACKAGES=1 in the build
// environment and the app still reads everything.
def withPythonPackages = !(System.getenv("AURA_NO_PYTHON_PACKAGES") ?: "").trim()

android {
    namespace 'org.aura.app'
    compileSdk 34

    defaultConfig {
        applicationId 'org.aura.app'
        minSdk 26
        targetSdk 34
        // Bumped whenever the phone-visible behaviour changes, because the
        // settings screen shows this string: "did the new build actually
        // install?" should be answerable from the phone without guessing.
        versionCode 2
        versionName '1.1.0'

        // The Python interpreter and the engine are both native code, and a
        // 32-bit build would need a different engine. A phone that runs a
        // multi-gigabyte model is a 64-bit one, so that is what this builds.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The engine is an executable, and native libraries are only extracted (and
    // therefore only executable) when they are stored uncompressed in the APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            // Where prepareAuraEngine puts the engine. It does not exist in a
            // fresh clone; the task creates it before anything is packaged.
            jniLibs.srcDirs += [engineJniDir.get().asFile]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version = pythonVersion
        if (buildPythonExe != null) {
            buildPython(buildPythonExe)
        }
        pip {
            // The three optional packages the desktop requirements.txt lists.
            // AURA imports each one where it is used and falls back when it is
            // absent (aura/ingest.py has a built-in PDF text scan and a DOCX
            // reader for exactly this), so if a build machine cannot reach the
            // package index, build with AURA_NO_PYTHON_PACKAGES=1 set and the
            // app still reads everything - it just says in the document's notes
            // which reader it used.
            if (withPythonPackages) {
                install "pypdf"
                install "python-docx"
                install "Pillow"
            }
        }
    }
    sourceSets {
        getByName("main") {
            // AURA itself: the same files as src/aura-app/aura.
            srcDirs = ["src/main/python"]
        }
    }
}

// ---------------------------------------------------------------------------
// Unpacking the engine into the APK
// ---------------------------------------------------------------------------
/** "243.6 MB" - so the log says sizes in units a person reads. */
String humanSize(long bytes) {
    def value = bytes as double
    def units = ["B", "KB", "MB", "GB"]
    def index = 0
    while (value >= 1024.0d && index < units.size() - 1) {
        value /= 1024.0d
        index++
    }
    return index <= 1 ? String.format("%.0f %s", value, units[index])
                      : String.format("%.1f %s", value, units[index])
}

/** The lowercase hex sha256 of a file. */
String sha256Of(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[1 << 16]
        int read = 0
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
}

/** Fetch the engine archive from the first source that hands over a whole copy.
 *
 *  Every attempt is checked against the pinned size and sha256, so a truncated
 *  download, or a mirror that has changed underneath us, is retried instead of
 *  being unpacked into an app that will not run. If nothing works it throws with
 *  every reason attached - a build log that says why is worth a lot more than
 *  one that says "could not prepare the engine".
 */
File fetchEngineArchive(File rawDir, String archiveName, List<String> urls,
                        long expectedBytes, String expectedSha256, File target) {
    rawDir.mkdirs()
    def problems = new ArrayList<String>()
    for (String url : urls) {
        for (int attempt = 1; attempt <= 2; attempt++) {
            def part = new File(rawDir, archiveName + ".part")
            part.delete()
            try {
                auraLog.lifecycle("AURA: fetching the model engine from ${url} (attempt ${attempt})")
                def connection = new URL(url).openConnection()
                connection.connectTimeout = 30000
                connection.readTimeout = 180000
                connection.setRequestProperty("User-Agent", "AURA-build")
                connection.inputStream.withCloseable { input ->
                    part.withOutputStream { output ->
                        byte[] buffer = new byte[1 << 16]
                        int read = 0
                        while ((read = input.read(buffer)) > 0) {
                            output.write(buffer, 0, read)
                        }
                    }
                }
            } catch (Exception error) {
                part.delete()
                problems << "${url} (attempt ${attempt}): ${error}"
                continue
            }
            long bytes = part.length()
            if (expectedBytes > 0L && bytes != expectedBytes) {
                part.delete()
                problems << "${url}: got ${bytes} bytes, expected ${expectedBytes}"
                continue
            }
            String digest = sha256Of(part)
            if (expectedSha256 && !expectedSha256.equalsIgnoreCase(digest)) {
                part.delete()
                problems << "${url}: sha256 ${digest}, expected ${expectedSha256}"
                continue
            }
            if (!part.renameTo(target)) {
                part.delete()
                problems << "${url}: the finished download could not be kept"
                continue
            }
            auraLog.lifecycle("AURA: the model engine archive arrived whole (${humanSize(bytes)})")
            return target
        }
    }
    throw new GradleException("no source produced a valid engine archive:\n  " + problems.join("\n  "))
}

/** True when the built APK really does carry the engine.
 *
 *  Asked of the APK itself rather than of the step that was supposed to put it
 *  there, because the failure that matters is not "the download failed" - it is
 *  "the download failed and the APK shipped anyway".
 */
boolean apkCarriesEngine(File apk, String binaryName) {
    def zip = new java.util.zip.ZipFile(apk)
    try {
        return zip.getEntry("lib/arm64-v8a/" + binaryName) != null
    } finally {
        zip.close()
    }
}

List<File> stripTools() {
    def found = []
    // Named apart from the onPath() method above so there is no shadowing.
    def toolOnPath = { String name ->
        def path = System.getenv("PATH") ?: ""
        for (String entry : path.split(File.pathSeparator)) {
            def candidate = new File(entry, name)
            if (candidate.isFile() && candidate.canExecute()) {
                return candidate
            }
        }
        return null
    }
    // A host strip tool handles a foreign architecture perfectly well - it only
    // rewrites the symbol and debug tables. Prefer llvm-strip, then the NDK's.
    ["llvm-strip", "aarch64-linux-gnu-strip", "strip"].each { name ->
        def exe = toolOnPath(name)
        if (exe != null) {
            found << exe
        }
    }
    [System.getenv("ANDROID_NDK_HOME"), System.getenv("ANDROID_NDK_ROOT")].each { ndk ->
        if (ndk) {
            def exe = new File(ndk, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip")
            if (exe.isFile()) {
                found << exe
            }
        }
    }
    def sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdk) {
        def ndkRoot = new File(sdk, "ndk")
        if (ndkRoot.isDirectory()) {
            (ndkRoot.listFiles() ?: []).each { version ->
                def exe = new File(version, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip")
                if (exe.isFile()) {
                    found << exe
                }
            }
        }
    }
    return found
}

boolean tryStrip(File tool, File file) {
    try {
        def process = new ProcessBuilder(tool.absolutePath, "--strip-unneeded", file.absolutePath)
                .redirectErrorStream(true).start()
        def text = process.inputStream.text
        def code = process.waitFor()
        if (code != 0) {
            auraLog.lifecycle("AURA: ${tool.name} could not strip ${file.name}: ${text.trim()}")
        }
        return code == 0 && file.length() > 0L
    } catch (Exception ignored) {
        return false
    }
}

/** Strip the debug information out of the engine, best effort and safely.
 *
 *  It is nearly all of what the engine weighs: the fourteen files as published
 *  total about 243 MB, and stripping removes most of that - the sizes before and
 *  after are logged, so the build log says what the APK is really carrying.
 *  Nothing here is worth failing a build over (the engine runs either way, it is
 *  only bigger), so every step works on a copy and is abandoned quietly if it
 *  does not work. */
void stripEngine(File outDir, List<String> names, String binaryName) {
    def tools = stripTools()
    def sizeOf = { List<String> list -> list.inject(0L) { total, name -> total + new File(outDir, name).length() } }
    long before = sizeOf(names)
    if (tools.isEmpty()) {
        auraLog.warn("AURA: no ELF strip tool on this machine (looked on PATH and in every NDK) - the "
                + "engine keeps its debug information and the APK will be about ${humanSize(before)} "
                + "bigger than it needs to be. On a Debian-style build machine: apt-get install -y binutils")
        return
    }
    def binary = new File(outDir, binaryName)
    for (File tool : tools) {
        if (!binary.isFile()) {
            return
        }
        def probe = new File(outDir, binaryName + ".probe")
        probe.bytes = binary.bytes
        if (!tryStrip(tool, probe)) {
            probe.delete()
            continue
        }
        probe.delete()
        auraLog.lifecycle("AURA: stripping the engine (${humanSize(before)}) with ${tool}")
        names.each { name ->
            def target = new File(outDir, name)
            if (!target.isFile()) {
                return
            }
            def copy = new File(outDir, name + ".unstripped")
            copy.bytes = target.bytes
            if (tryStrip(tool, copy)) {
                target.delete()
                if (!copy.renameTo(target)) {
                    copy.delete()
                }
            } else {
                copy.delete()
            }
        }
        long after = sizeOf(names)
        auraLog.lifecycle("AURA: the engine is ${humanSize(after)} (was ${humanSize(before)})")
        return
    }
    auraLog.warn("AURA: none of the strip tools on this machine could strip the engine - it keeps "
            + "its debug information and the APK will be about ${humanSize(before)} bigger than it "
            + "needs to be")
}

tasks.register("prepareAuraEngine") {
    description = "Unpacks the llama.cpp Android engine into the app's native libraries."
    group = "aura"
    outputs.dir(engineJniDir)
    outputs.file(engineStamp)

    doLast {
        def stamp = engineStamp.get().asFile
        if (stamp.isFile()) {
            logger.lifecycle("AURA: the model engine is already unpacked")
            return
        }
        try {
            def rawDir = engineRawDir.get().asFile
            def outDir = engineJniDir.get().asFile
            def archive = new File(rawDir, engineArchiveName)

            // A copy left over from an earlier run is only reused if it is
            // still exactly the file we think it is.
            if (archive.isFile() && (archive.length() != engineArchiveBytes
                    || !engineArchiveSha256.equalsIgnoreCase(sha256Of(archive)))) {
                logger.lifecycle("AURA: the cached engine archive does not match the pinned one - fetching again")
                archive.delete()
            }
            if (!archive.isFile()) {
                fetchEngineArchive(rawDir, engineArchiveName, engineMirrors,
                        engineArchiveBytes, engineArchiveSha256, archive)
            }

            def unpacked = new File(rawDir, "unpacked")
            project.delete(unpacked)
            unpacked.mkdirs()
            project.ant.untar(src: archive, dest: unpacked, compression: "gzip", overwrite: true)
            def sourceDir = null
            unpacked.eachDirRecurse { dir ->
                if (sourceDir == null && new File(dir, "llama-server").isFile()) {
                    sourceDir = dir
                }
            }
            if (sourceDir == null) {
                throw new IOException("the archive did not contain llama-server")
            }

            def wanted = new LinkedHashMap<String, String>()
            wanted["llama-server"] = engineBinary
            engineLibs.each { name -> wanted[name] = name }

            def missing = []
            outDir.mkdirs()
            wanted.each { from, to ->
                def source = new File(sourceDir, from)
                if (source.isFile()) {
                    new File(outDir, to).bytes = source.bytes
                } else {
                    missing << from
                }
            }
            if (missing) {
                // Half an engine is not an engine: llama-server would start and
                // die on a missing shared object, which is the worst kind of
                // failure to debug from a phone.
                throw new IOException("the engine archive did not contain ${missing.join(', ')}")
            }

            // engineBinary is a script-level `def`, which stripEngine() - a
            // method - cannot see, so it is handed over explicitly.
            stripEngine(outDir, new ArrayList<String>(wanted.values()), engineBinary)

            stamp.parentFile.mkdirs()
            stamp.text = "${engineTag}\n"
            long total = wanted.values().inject(0L) { sum, name -> sum + new File(outDir, name).length() }
            logger.lifecycle("AURA: the model engine is ready - ${wanted.size()} files, ${humanSize(total)}, "
                    + "${engineTag}")
        } catch (Exception error) {
            if (engineRequired) {
                // Deliberately fatal. Shipping an APK with no engine in it looks
                // like success and behaves like a broken app, and the person who
                // finds out is the one holding the phone. Pass
                // -PauraEngineOptional=true to build the quoted-answers-only
                // version on purpose.
                throw new GradleException("AURA: the model engine could not be bundled, so this build "
                        + "is stopping here rather than producing an app that cannot run a model. "
                        + "Reason: ${error}. Pass -PauraEngineOptional=true if you really want the "
                        + "engine-less build.", error)
            }
            logger.warn("AURA: could not prepare the model engine (${error}), and -PauraEngineOptional "
                    + "was given, so the app will still build: it will index, search and answer with "
                    + "quoted passages, but it will not be able to run a local model - and it will say "
                    + "so on screen.")
        }
    }
}

def auraEngine = tasks.named("prepareAuraEngine")

// The engine has to be in place before anything packages native libraries. The
// task names are Android Gradle plugin internals, so both the specific ones and
// the catch-all preBuild are wired up.
tasks.matching { it.name.startsWith("merge") && (it.name.endsWith("JniLibFolders")
        || it.name.endsWith("NativeLibs")) }.configureEach {
    dependsOn(auraEngine)
}
tasks.named("preBuild") {
    dependsOn(auraEngine)
}

// ---------------------------------------------------------------------------
// The proof
// ---------------------------------------------------------------------------
// The engine step above can be cached, skipped, or quietly undone by a later
// change to packaging, so the last word belongs to the APK itself: every APK
// this project assembles is opened, its size printed in the log, and the engine
// looked for inside it. When the engine is required (the default) an APK
// without one fails the build here - which is the only place that can be caught
// for certain, and the difference between "the build broke" and "the app
// installed and then could not run a model".
tasks.matching { it.name == "assembleRelease" || it.name == "assembleDebug" }.configureEach {
    doLast {
        def apkRoot = layout.buildDirectory.dir("outputs/apk").get().asFile
        def apks = []
        if (apkRoot.isDirectory()) {
            apkRoot.eachFileRecurse { file ->
                if (file.isFile() && file.name.endsWith(".apk")) {
                    apks << file
                }
            }
        }
        if (apks.isEmpty()) {
            logger.warn("AURA: no APK was found to check under ${apkRoot}")
            return
        }
        boolean engineMissing = false
        apks.each { apk ->
            boolean carries = apkCarriesEngine(apk, engineBinary)
            logger.lifecycle("AURA: ${apk.name} - ${humanSize(apk.length())}" +
                    (carries ? " - the model engine is inside it" : " - NO MODEL ENGINE INSIDE IT"))
            if (!carries) {
                engineMissing = true
            }
        }
        if (engineMissing && engineRequired) {
            throw new GradleException("AURA: an APK was assembled without the model engine in it, and "
                    + "this build requires one - see the prepareAuraEngine log above for the reason. "
                    + "Pass -PauraEngineOptional=true if you meant to build the quoted-answers-only "
                    + "version.")
        }
    }
}
